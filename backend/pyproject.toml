[project]
name = "backend"
version = "0.2.0"
description = "Short-URL backend REST API"
authors = [
    {name = "Yazan-Yk9",email = "yksy.dev@gmail.com"}
]
license = "MIT License"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx2 (>=2.12.0,<3.0.0)"
]
